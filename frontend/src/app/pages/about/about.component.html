<div class="about-stage">
  <div class="about-bg" aria-hidden="true">
    <span class="wash wash-a"></span>
    <span class="wash wash-b"></span>
    <span class="ring ring-a"></span>
    <span class="ring ring-b"></span>
    <span class="ring ring-c"></span>
    <span class="glass glass-a"></span>
    <span class="glass glass-b"></span>
  </div>
  <app-site-header [services]="services" />
  <main class="about-main">
    <p class="text-sm font-bold uppercase tracking-[0.18em] text-accent">{{ about().kicker }}</p>
    <h1 class="mt-3 max-w-[12ch] text-[clamp(48px,7vw,84px)] font-black leading-none tracking-tight">{{ about().title }}</h1>
    <p class="mt-6 max-w-2xl text-lg leading-relaxed text-black/60">{{ about().intro }}</p>
    <p class="mt-4 max-w-2xl text-lg leading-relaxed text-black/60">{{ about().detail }}</p>
    <section id="work" class="work-path">
      <h2>{{ about().work_title }}</h2>
      <ol class="work-rail">
        @for (step of about().steps; track step.n) {
          <li class="work-step">
            <span class="work-node">{{ step.n }}</span>
            <article class="work-card">
              <h3>{{ step.title }}</h3>
              <p>{{ step.text }}</p>
            </article>
          </li>
        }
      </ol>
    </section>
    <a routerLink="/contact" class="mt-10 inline-flex rounded-full bg-accent px-6 py-3 font-bold text-white">Start your project</a>
  </main>
</div>
