<app-site-header [services]="services" />
<main class="px-5 py-12 sm:px-[6vw] sm:py-16">
  <div class="mx-auto max-w-4xl">
    <p class="text-sm font-bold uppercase tracking-[0.18em] text-accent">Staff</p>
    <h1 class="mt-3 text-[clamp(48px,7vw,84px)] font-black leading-none tracking-tight">Gallery</h1>
    <p class="mt-5 max-w-xl text-lg text-black/60">Videos stored from the admin section appear here for signed-in employees.</p>
    @if (!videos().length) {
      <p class="mt-12 rounded-[24px] border border-black/10 bg-white px-6 py-5 text-black/60">No videos yet.</p>
    }
    <div class="mt-12 grid gap-8">
      @for (item of videos(); track item.id) {
        <article class="overflow-hidden rounded-[28px] border border-black/10 bg-white">
          <video class="gallery-player" controls preload="metadata" [src]="src(item.id)"></video>
          <h2 class="px-6 py-5 text-2xl font-black tracking-tight">{{ item.title }}</h2>
        </article>
      }
    </div>
  </div>
</main>
